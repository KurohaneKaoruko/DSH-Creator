# dsh-novel-editor bundle patch
#
# An OPTIONAL companion bundle for the novelist preset (installed separately,
# never auto-mounted with the preset). One plugin row registers:
#   - a webServer prefix route /novel-editor/api for workspace file writes;
#   - the Client half (client.js) mounts:
#       · a full-page reading view on the `main` slot (key: novel-editor);
#       · a sidebar panel icon on `sidebar.panellist` to open it;
#       · a novel-optimized markdown document renderer on
#         `sidebar.right.tab.document` (key: markdown-novel) so chapter files
#         preview with novel typography in the right sidebar.
- insert:
    - id: novel-editor
      name: 'dsh-novel-editor'
      config: {}
