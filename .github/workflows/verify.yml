name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 规则 + 工具 + 工作台 Host 路由：不装内核，几秒跑完。
  tests:
    name: 规则 / 工具 / 工作台测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 跑三层测试
        run: npm test

  # bundle 路线（DSH ≥ 0.1.7，含 0.2.x）：file: 依赖装进 profile，工作台 + 四助手。
  verify-bundle:
    name: bundle 冒烟（0.2.2）
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 安装 bundle 验证内核
        run: npm run kernel:install
      - name: bundle 冒烟（四助手 roster/诊断/skills + 工作台落位）
        run: npm run verify:bundle
